name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Build and run component tests
        working-directory: web
        run: npm run build && npm run test:unit

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run critical browser journeys
        working-directory: web
        run: npm run test:e2e

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Scan every repository file for credential literals
        run: go run ./cmd/provider-preflight --mode scan

      - name: Unit, race, contract, vet and secret checks
        run: make video-test

      - name: No-key Compose smoke
        run: |
          trap 'make video-down' EXIT
          make video-up
          make video-smoke
