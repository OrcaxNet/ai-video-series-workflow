name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Scan every repository file for credential literals
        run: go run ./cmd/provider-preflight --mode scan

      - name: Unit, race, contract, vet and secret checks
        run: make video-test

      - name: No-key Compose smoke
        run: |
          trap 'make video-down' EXIT
          make video-up
          make video-smoke
